<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="out.css"></head>
<body class="bg-surface-canvas font-sans text-text-primary p-12">
  <h1 class="text-heading-lg mb-6">VCP Button — from the imported tokens</h1>
  <div class="flex flex-col gap-6">
    <div class="flex items-center gap-3">
      <button class="inline-flex items-center justify-center text-label-lg rounded-md h-10 px-4 bg-action-primary-surface-default text-action-primary-content-default">Primary</button>
      <button class="inline-flex items-center justify-center text-label-lg rounded-md h-10 px-4 bg-action-secondary-surface-default text-action-secondary-content-default border border-action-secondary-border-default">Secondary</button>
      <button class="inline-flex items-center justify-center text-label-lg rounded-md h-10 px-4 text-action-tertiary-content-default">Tertiary</button>
      <button class="inline-flex items-center justify-center text-label-lg rounded-md h-10 px-4 bg-accent-critical-filled-surface-default text-accent-critical-filled-content-default">Delete</button>
      <button class="inline-flex items-center justify-center text-label-lg h-10 px-4 text-text-link-default underline underline-offset-4">Learn more</button>
      <button class="inline-flex items-center justify-center text-label-lg rounded-md h-10 px-4 bg-action-primary-surface-disabled text-action-primary-content-disabled">Disabled</button>
    </div>
    <div class="flex gap-3">
      <div class="bg-surface-base border border-stroke-default rounded-md p-4 shadow-card w-72">
        <p class="text-label-lg text-text-primary">Card on surface.base</p>
        <p class="text-body-sm text-text-secondary mt-1">Secondary text, stroke.default border, shadow.card.</p>
      </div>
      <div class="bg-accent-success-tonal-surface-default rounded-md p-4 w-72">
        <p class="text-label-lg text-accent-success-tonal-content-default">Success tonal</p>
        <p class="text-body-sm text-accent-success-tonal-content-default mt-1">accent.success.tonal pair.</p>
      </div>
      <div class="bg-accent-warning-tonal-surface-default rounded-md p-4 w-72">
        <p class="text-label-lg text-accent-warning-tonal-content-default">Warning tonal</p>
        <p class="text-body-sm text-accent-warning-tonal-content-default mt-1">accent.warning.tonal pair.</p>
      </div>
      <div class="bg-accent-critical-tonal-surface-default rounded-md p-4 w-72 shadow-menu">
        <p class="text-label-lg text-accent-critical-tonal-content-default">Critical tonal</p>
        <p class="text-body-sm text-accent-critical-tonal-content-default mt-1">with shadow.menu.</p>
      </div>
    </div>
    <div class="bg-surface-brand-base border border-stroke-brand-subtle rounded-md p-4 w-fit">
      <span class="text-text-brand-strong text-title-sm">surface.brand.base + text.brand.strong</span>
    </div>
  </div>
</body></html>
