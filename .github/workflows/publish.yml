name: Publish
# Publishes the package to GitHub Packages when main carries a version that
# isn't on the registry yet: merging a release PR (made by `npm run changelog`)
# is the release. Every other merge finds its version already published and
# stops after the check. "Run workflow" on the Actions tab does the same by
# hand, e.g. for a version that was merged but never published.
on:
  push: { branches: [main] }
  workflow_dispatch:

# Two merges in a row publish one after the other, never at the same time.
concurrency: { group: publish, cancel-in-progress: false }

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # npm publish; also reads @vdm-design-team/gdl for npm ci
    env:
      # setup-node writes an .npmrc that reads this. The built-in token, no personal one.
      NODE_AUTH_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@vdm-design-team'

      - name: Is this version on the registry yet?
        id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          # Every published version, as JSON. A failure here (auth, network)
          # fails the job rather than guessing.
          published=$(npm view "$name" versions --json)
          if node -e "process.exit([].concat(JSON.parse(process.argv[1])).includes(process.argv[2]) ? 0 : 1)" "$published" "$version"; then
            echo "$name@$version is already published; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "$name@$version is not on the registry yet; publishing it."
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.publish == 'true'
        run: npm ci
      - if: steps.check.outputs.publish == 'true'
        name: Build the package (tokens, JS, types, theme)
        run: npm run build
      - if: steps.check.outputs.publish == 'true'
        name: Publish
        run: npm publish
      - if: steps.check.outputs.publish == 'true'
        name: Summary
        env: { VERSION: '${{ steps.check.outputs.version }}' }
        run: echo "Published @vdm-design-team/vcp-design-system@$VERSION to GitHub Packages." >> "$GITHUB_STEP_SUMMARY"
