name: Chromatic
on:
  pull_request:
  push: { branches: [main] }

jobs:
  chromatic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # the visual-review comment below
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # Chromatic needs full history for baselines
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run tokens
      - uses: chromaui/action@latest
        id: chromatic
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: 'storybook:build'
          onlyChanged: true        # TurboSnap: only snapshot affected stories
          exitOnceUploaded: true
          # Every build on main becomes the new baseline, with no one in the loop.
          # Without this, baselines only advance when a human accepts a build — and
          # if nobody does, each new build diffs against an ever-older snapshot until
          # the changes pile up into noise and the tool stops being read at all.
          # The trade is deliberate: a visual regression that lands on main is
          # accepted silently. PR builds still diff against main, which is the
          # comparison worth looking at, and they stay non-blocking.
          autoAcceptChanges: main

      # One sticky comment per PR with the two links a reviewer needs: the
      # Chromatic build (side-by-side before/after of every changed story)
      # and the live Storybook built from this branch. Updated in place on
      # every push so the PR never collects a trail of stale link comments.
      - name: Post visual review links on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          BUILD_URL: ${{ steps.chromatic.outputs.buildUrl }}
          STORYBOOK_URL: ${{ steps.chromatic.outputs.storybookUrl }}
        with:
          script: |
            const marker = '<!-- visual-review-links -->';
            const body = [
              marker,
              '## 🔍 Visual review',
              '',
              '| What | Where |',
              '|---|---|',
              `| **Before → after diffs** — every story this PR changes, side by side against \`main\` | ${process.env.BUILD_URL} |`,
              `| **Live Storybook for this branch** — click through the real components | ${process.env.STORYBOOK_URL} |`,
              '',
              '_Updated automatically on every push. Diffs may take a minute to finish after this comment appears._',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
