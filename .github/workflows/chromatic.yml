name: Chromatic
on:
  pull_request:
  push: { branches: [main] }

jobs:
  chromatic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # the visual-review comment below
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # Chromatic needs full history for baselines
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run tokens
      - uses: chromaui/action@latest
        id: chromatic
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: 'storybook:build'
          onlyChanged: true        # TurboSnap: only snapshot affected stories
          # TurboSnap decides what to re-snapshot by tracing changed files
          # through the Storybook module graph. Token sources are invisible to
          # that trace: `npm run tokens` compiles `tokens/` into `dist/`, and
          # `dist/` is gitignored — so the only file git ever sees change is the
          # source, which no story imports. Storybook consumes the built output
          # instead (`.storybook/storybook.css` imports `dist/theme.css`, the
          # gallery imports `dist/tokens.json`), which means a token change
          # repaints every story while tracing to none. PR #66 deleted a whole
          # colour ramp and Chromatic skipped the build; it was only verified
          # after it had already reached main. `externals` disables TurboSnap
          # when a matching file changes, so a token change snapshots
          # everything — which is right, because a token change can affect
          # everything.
          externals: '{tokens/**,style-dictionary.config.mjs}'
          exitOnceUploaded: true
          # Every build on main becomes the new baseline, with no one in the loop.
          # Without this, baselines only advance when a human accepts a build — and
          # if nobody does, each new build diffs against an ever-older snapshot until
          # the changes pile up into noise and the tool stops being read at all.
          # The trade is deliberate: a visual regression that lands on main is
          # accepted silently. PR builds still diff against main, which is the
          # comparison worth looking at, and they stay non-blocking.
          autoAcceptChanges: main

      # One sticky comment per PR with the two links a reviewer needs: the
      # Chromatic build (side-by-side before/after of every changed story)
      # and the live Storybook built from this branch. Updated in place on
      # every push so the PR never collects a trail of stale link comments.
      - name: Post visual review links on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          BUILD_URL: ${{ steps.chromatic.outputs.buildUrl }}
          STORYBOOK_URL: ${{ steps.chromatic.outputs.storybookUrl }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const marker = '<!-- visual-review-links -->';
            // TurboSnap skips the whole build when a push touches no frontend
            // files — a skipped build has no URLs, so never render dead links.
            // Token sources are covered by `externals` above, so a skip here
            // really does mean nothing visual changed.
            const buildUrl = process.env.BUILD_URL;
            const storybookUrl = process.env.STORYBOOK_URL;
            const skipped = !buildUrl || buildUrl === 'undefined';
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            // A Storybook has no idea what a PR changed, so its link opens at
            // the root. Work it out from the diff instead: every changed file
            // under a piece's folder maps to that folder's story file, whose
            // `title` is what Storybook builds the URL from. The reviewer then
            // lands on the component the PR is about, not on the front page.
            const storyIdFromTitle = (title) =>
              title.toLowerCase()
                .replace(/[ ’–—―′¿'`~!@#$%^&*()_|+\-=?;:'",.<>{}[\]\\/]/g, '-')
                .replace(/-+/g, '-').replace(/^-+|-+$/g, '');
            const storiesTouched = (files) => {
              const dirs = new Set();
              for (const f of files) {
                const m = f.match(/^(src\/(?:atoms|components|patterns|templates)\/[^/]+)\//);
                if (m) dirs.add(m[1]);
              }
              const out = new Map();
              for (const dir of [...dirs].sort()) {
                if (!fs.existsSync(dir)) continue; // the PR deleted the piece
                for (const file of fs.readdirSync(dir).filter((n) => n.endsWith('.stories.tsx'))) {
                  const src = fs.readFileSync(path.join(dir, file), 'utf8');
                  // The meta's title, not a story's `args.title` further down.
                  const title = src.match(/const meta\b[\s\S]*?\btitle:\s*['"`]([^'"`]+)['"`]/)?.[1];
                  if (title) out.set(storyIdFromTitle(title), title);
                }
              }
              return [...out].map(([id, title]) => ({ id, title }));
            };

            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
            const existing = comments.data.find(c => c.body.includes(marker));
            // A skipped build says nothing about the PR as a whole — earlier
            // pushes may have produced real diffs. If the sticky comment
            // already holds build links, keep them and just note that the
            // latest push added nothing visual.
            const staleNote = '_The latest push had nothing visual to diff; links are from the last snapshotted push._';
            if (skipped && existing && existing.body.includes('chromatic.com/build')) {
              if (!existing.body.includes(staleNote)) {
                await github.rest.issues.updateComment({
                  owner, repo, comment_id: existing.id,
                  body: existing.body + '\n\n' + staleNote,
                });
              }
              return;
            }
            const lines = [marker, '## 🔍 Visual review', ''];
            if (skipped) {
              lines.push(
                '_This push changes no story, component, or token files — there is nothing visual to diff, so Chromatic skipped snapshotting it._'
              );
            } else {
              const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: issue_number, per_page: 100 });
              const stories = storiesTouched(files.map((f) => f.filename));
              const docsUrl = (id) => `${storybookUrl}?path=/docs/${id}--docs`;
              // Land on the first touched piece; fall back to the root only
              // when the PR touches no piece (tokens, tooling, docs).
              const landing = stories.length ? docsUrl(stories[0].id) : storybookUrl;
              const landingLabel = stories.length
                ? `**Live Storybook for this branch** — opens on \`${stories[0].title}\``
                : '**Live Storybook for this branch** — click through the real components';
              lines.push(
                '| What | Where |',
                '|---|---|',
                `| **Before → after diffs** — every story this PR changes, side by side against \`main\` | [Open in Chromatic](${buildUrl}) |`,
                `| ${landingLabel} | [Open Storybook](${landing}) |`,
                ''
              );
              if (stories.length > 1) {
                lines.push('**Pieces this PR touches**', '');
                for (const s of stories) lines.push(`- [${s.title}](${docsUrl(s.id)})`);
                lines.push('');
              } else if (stories.length === 0) {
                lines.push(
                  '_No component folder changed, so there is no single story to land on. A token change repaints everything — the diffs link is the one to read._',
                  ''
                );
              }
              lines.push(
                '_Updated automatically on every push. Diffs may take a minute to finish after this comment appears._',
                '_The diff link asks you to sign in the first time — use **Connect with GitHub** and your access to this repo carries over. The Storybook link needs no account._'
              );
            }
            const body = lines.join('\n');
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
